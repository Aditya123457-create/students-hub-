<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #20243a;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: #172554;
            color: white;
            padding: 25px 18px;
            flex-shrink: 0;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .sidebar h4 {
            color: #a5b4fc;
            margin: 25px 10px 12px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .sidebar a {
            display: block;
            color: #dbeafe;
            text-decoration: none;
            padding: 13px 12px;
            border-radius: 8px;
            margin-bottom: 5px;
        }

        .sidebar a:hover {
            background: #334b91;
        }

        .main {
            flex: 1;
            min-width: 0;
        }

        .topbar {
            background: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px #00000008;
        }

        .search {
            padding: 11px 15px;
            border: 1px solid #e1e5ef;
            border-radius: 8px;
            width: 240px;
        }

        .content {
            padding: 30px;
        }

        .welcome {
            background: linear-gradient(120deg, #4338ca, #7c3aed);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .welcome h1 {
            margin-bottom: 12px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 13px;
            box-shadow: 0 3px 12px #00000008;
            margin-bottom: 18px;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            margin: 12px 0 5px;
        }

        .muted {
            color: #7b8194;
            font-size: 14px;
        }

        .section-title {
            margin: 25px 0 15px;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .course-card {
            background: white;
            padding: 22px;
            border-radius: 13px;
            box-shadow: 0 3px 12px #00000008;
        }

        .course-icon {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .progress {
            height: 9px;
            background: #e9ecf4;
            border-radius: 20px;
            overflow: hidden;
            margin: 12px 0;
        }

        .progress-fill {
            height: 100%;
            background: #4f46e5;
            border-radius: 20px;
        }

        .btn {
            display: inline-block;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            padding: 11px 17px;
            border-radius: 7px;
            border: none;
            margin-top: 12px;
            cursor: pointer;
        }

        .btn:hover {
            background: #3730a3;
        }

        .btn-light {
            background: #eef2ff;
            color: #4338ca;
        }

        .btn-light:hover {
            background: #dbeafe;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            text-align: left;
            padding: 16px;
            border-bottom: 1px solid #edf0f5;
        }

        th {
            color: #6b7280;
            font-size: 13px;
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #e0f2fe;
            color: #0369a1;
            font-size: 12px;
        }

        .badge-green {
            background: #dcfce7;
            color: #15803d;
        }

        .badge-orange {
            background: #ffedd5;
            color: #c2410c;
        }

        .two-columns {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .task {
            padding: 14px 0;
            border-bottom: 1px solid #edf0f5;
        }

        .footer {
            text-align: center;
            color: #8990a3;
            padding: 20px;
            font-size: 13px;
        }

        @media (max-width: 950px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .course-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {
            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
            }

            .sidebar h4 {
                display: none;
            }

            .topbar {
                padding: 15px;
            }

            .search {
                width: 130px;
            }

            .content {
                padding: 16px;
            }

            .stats,
            .course-grid,
            .two-columns {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">🎓 Student Hub</div>

        <h4>Main Menu</h4>

        <a href="/students/">▣ Dashboard</a>
        <a href="/students/profile/">👤 My Profile</a>
        <a href="/courses/">📚 My Courses</a>

        <h4>Learning</h4>

        <a href="/students/assignments/">📝 Assignments</a>
        <a href="/courses/lessons/">▶ Lessons</a>

        <h4>Other</h4>

        <a href="/students/about/">ℹ About Us</a>

    </aside>

    <div class="main">

        <header class="topbar">
            <input class="search" type="search"
                   placeholder="Search something...">

            <div>
                <span>🔔</span>
                &nbsp;&nbsp;
                <strong>Aditya 👤</strong>
            </div>
        </header>

        <main class="content">

            {% block content %}
            {% endblock %}

        </main>

        <footer class="footer">
            © 2026 Student Hub. All rights reserved.
        </footer>

    </div>

</div>

</body>
</html>
